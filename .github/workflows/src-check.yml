name: Проверка источников

on:
  workflow_dispatch:

jobs:
  check-and-revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 7

      - name: Проверить источники и обновить списки
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ----------------------------------------------------------
          # GitHub / Gist – через API коммитов
          # ----------------------------------------------------------
          get_github_last_commit_date() {
            local url="$1"
            set +e

            # Gist (gist.githubusercontent.com / gist.github.com)
            if echo "$url" | grep -qE 'gist\.githubusercontent\.com|gist\.github\.com'; then
              local gist_id
              if echo "$url" | grep -q 'gist\.githubusercontent\.com'; then
                gist_id=$(echo "$url" | awk -F/ '{print $5}')
              else
                gist_id=$(echo "$url" | awk -F/ '{print $6}')
              fi
              if [ -n "$gist_id" ]; then
                local api_url="https://api.github.com/gists/$gist_id"
                local response=$(curl -sS "$api_url")
                local updated=$(echo "$response" | jq -r '.updated_at // .history[0].committed_at // .created_at' 2>/dev/null)
                if [ -n "$updated" ] && [ "$updated" != "null" ]; then
                  echo "$updated"
                  set -e
                  return 0
                fi
              fi
              set -e
              return 1
            fi

            # Обычный GitHub (raw.githubusercontent.com или github.com)
            if echo "$url" | grep -qE 'github\.com|raw\.githubusercontent\.com'; then
              local owner repo branch path api_url
              if echo "$url" | grep -q 'raw\.githubusercontent\.com'; then
                owner=$(echo "$url" | awk -F/ '{print $4}')
                repo=$(echo "$url" | awk -F/ '{print $5}')
                if [ "$(echo "$url" | awk -F/ '{print $6}')" = "refs" ] && [ "$(echo "$url" | awk -F/ '{print $7}')" = "heads" ]; then
                  branch=$(echo "$url" | awk -F/ '{print $8}')
                  path=$(echo "$url" | awk -F/ '{for(i=9;i<=NF;i++) printf "%s%s", $i, (i<NF?"/":"")}')
                else
                  branch=$(echo "$url" | awk -F/ '{print $6}')
                  path=$(echo "$url" | awk -F/ '{for(i=7;i<=NF;i++) printf "%s%s", $i, (i<NF?"/":"")}')
                fi
              else
                owner=$(echo "$url" | awk -F/ '{print $4}')
                repo=$(echo "$url" | awk -F/ '{print $5}')
                if [ "$(echo "$url" | awk -F/ '{print $6}')" = "blob" ] || [ "$(echo "$url" | awk -F/ '{print $6}')" = "tree" ]; then
                  branch=$(echo "$url" | awk -F/ '{print $7}')
                  path=$(echo "$url" | awk -F/ '{for(i=8;i<=NF;i++) printf "%s%s", $i, (i<NF?"/":"")}')
                else
                  branch=$(echo "$url" | awk -F/ '{print $6}')
                  path=$(echo "$url" | awk -F/ '{for(i=7;i<=NF;i++) printf "%s%s", $i, (i<NF?"/":"")}')
                fi
              fi
              if [ -n "$owner" ] && [ -n "$repo" ] && [ -n "$branch" ] && [ -n "$path" ]; then
                api_url="https://api.github.com/repos/$owner/$repo/commits?sha=$branch&path=$path&per_page=1"
                local response=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" "$api_url")
                if echo "$response" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
                  local date_commit=$(echo "$response" | jq -r '.[0].commit.committer.date // .[0].commit.author.date // empty' 2>/dev/null)
                  if [ -n "$date_commit" ] && [ "$date_commit" != "null" ]; then
                    echo "$date_commit"
                    set -e
                    return 0
                  fi
                fi
              fi
            fi
            set -e
            return 1
          }

          # ----------------------------------------------------------
          # Все остальные сайты – через HTTP-заголовок Last-Modified
          # ----------------------------------------------------------
          get_last_modified_date() {
            local url="$1"
            set +e
            local headers=$(curl -s -L --range 0-0 --dump-header - -o /dev/null --max-time 15 "$url" 2>/dev/null)
            local last_modified=$(echo "$headers" | grep -i '^last-modified:' | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\r')
            if [ -n "$last_modified" ]; then
              date -d "$last_modified" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || { set -e; return 1; }
              set -e
              return 0
            else
              set -e
              return 1
            fi
          }

          # ----------------------------------------------------------
          # Проверка устаревания (срок в днях)
          # ----------------------------------------------------------
          is_stale_date() {
            local date_str="$1"
            local days_limit="$2"
            [ -z "$date_str" ] || [ "$date_str" = "null" ] && return 1
            local current_epoch=$(date -u +%s)
            local commit_epoch=$(date -u -d "$date_str" +%s 2>/dev/null) || return 1
            local age_days=$(( (current_epoch - commit_epoch) / 86400 ))
            [ $age_days -gt $days_limit ]
          }

          # ----------------------------------------------------------
          # Подготовка файлов
          # ----------------------------------------------------------
          touch sources.txt old_sources.txt
          cp sources.txt sources_backup.txt
          cp old_sources.txt old_sources_backup.txt

          STALE_DAYS=1
          > sources_tmp.txt
          > old_tmp.txt

          # ----------------------------------------------------------
          # Основная функция валидации одной строки
          # ----------------------------------------------------------
          validate_source() {
            local line="$1"
            local is_old_list="$2"

            [ -z "$line" ] && return

            # Визуальный разделитель между источниками
            echo "" >&2

            # Комментарии сохраняем во временные файлы
            if echo "$line" | grep -q '^\s*#'; then
              if [ "$is_old_list" = true ]; then
                echo "$line" >> old_tmp.txt
              else
                echo "$line" >> sources_tmp.txt
              fi
              return
            fi

            local line_clean="$line"
            local is_json=false
            if echo "$line" | grep -q '^j[[:space:]]'; then
              is_json=true
              line_clean=$(echo "$line" | sed -e 's/^j[[:space:]]*//')
            fi

            local url=$(echo "$line_clean" | awk '{print $1}')

            echo "Проверяю: $url" >&2

            # Один запрос curl
            set +e
            local curl_out=$(curl -sS -L --max-time 15 -o /dev/null -w "%{http_code} %{url_effective}" "$url" 2>/dev/null || echo "000 $url")
            local curl_exit=$?
            set -e
            local http_code=$(echo "$curl_out" | awk '{print $1}')
            local effective_url=$(echo "$curl_out" | awk '{print $2}')

            # Недоступность
            if [ -z "$http_code" ] || [[ ! "$http_code" =~ ^[23] ]]; then
              if [ "$is_old_list" = true ]; then
                echo "   ⛔ Недоступен (curl=$curl_exit, HTTP=$http_code), оставляю" >&2
              else
                echo "   ❌ Недоступен (curl=$curl_exit, HTTP=$http_code), переношу" >&2
              fi
              echo "$line" >> old_tmp.txt
              echo "" >&2
              return
            fi

            # Проверка даты – теперь для ВСЕХ источников (включая JSON)
            local last_update=""
            if echo "$effective_url" | grep -qE 'github\.com|raw\.githubusercontent\.com|gist\.github\.com|gist\.githubusercontent\.com'; then
              last_update=$(get_github_last_commit_date "$effective_url")
            else
              last_update=$(get_last_modified_date "$effective_url")
            fi

            if [ -z "$last_update" ] || [ "$last_update" = "null" ]; then
              echo "   ℹ️ Дата обновления не найдена" >&2
              if [ "$is_old_list" = true ]; then
                echo "   ✅ Оставляю" >&2
                echo "$line" >> old_tmp.txt
                echo "" >&2
                return
              else
                echo "   ✅ Оставляю" >&2
              fi
            else
              if is_stale_date "$last_update" $STALE_DAYS; then
                echo "   📅 Обновлён $last_update" >&2
                if [ "$is_old_list" = true ]; then
                  echo "   ⚠️ Устарел, оставляю" >&2
                else
                  echo "   ⚠️ Устарел, переношу" >&2
                fi
                echo "$line" >> old_tmp.txt
                echo "" >&2
                return
              else
                echo "   📅 Обновлён $last_update" >&2
                if [ "$is_old_list" = true ]; then
                  echo "   🔄 Актуально, переношу" >&2
                else
                  echo "   ✅ Актуально, оставляю" >&2
                fi
              fi
            fi

            echo "" >&2
            # Актуальные источники – в основной временный файл
            echo "$line" >> sources_tmp.txt
          }

          # ----------------------------------------------------------
          # Запуск проверки
          # ----------------------------------------------------------
          echo "====== ПРОВЕРКА sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" false || true
          done < sources_backup.txt

          echo "====== ПРОВЕРКА old_sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" true || true
          done < old_sources_backup.txt

          rm -f sources_backup.txt old_sources_backup.txt

          # Замена оригиналов временными файлами
          mv sources_tmp.txt sources.txt
          mv old_tmp.txt old_sources.txt
          
      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.txt old_sources.txt
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не требуется"
          else
            git commit -m "Обновление $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin main
          fi
