name: Проверка источников

on:
  workflow_dispatch:

jobs:
  check-and-revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Проверить источники и обновить списки
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ----------------------------------------------------------
          # GitHub / Gist – через API коммитов
          # ----------------------------------------------------------
          get_github_last_commit_date() {
            local url="$1"
            set +e

            # Gist
            if echo "$url" | grep -qE 'gist\.githubusercontent\.com|gist\.github\.com'; then
              local gist_id=$(echo "$url" | sed -E 's|https://[^/]+/([^/]+)/?.*|\1|' | awk -F/ '{print $(NF)}')
              if [ -n "$gist_id" ]; then
                local response=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/gists/$gist_id")
                local updated=$(echo "$response" | jq -r '.updated_at // .history[0].committed_at // .created_at' 2>/dev/null)
                if [ -n "$updated" ] && [ "$updated" != "null" ]; then
                  echo "$updated"
                  set -e
                  return 0
                fi
              fi
              set -e
              return 1
            fi

            # Обычный GitHub
            if echo "$url" | grep -qE 'github\.com|raw\.githubusercontent\.com'; then
              local clean_path=$(echo "$url" | sed -E 's|https://(raw\.)?github(usercontent)?\.com/||')
              local owner=$(echo "$clean_path" | cut -d'/' -f1)
              local repo=$(echo "$clean_path" | cut -d'/' -f2)
              local remain=$(echo "$clean_path" | cut -d'/' -f3-)

              local branch="" file_path=""

              if [ -z "$remain" ]; then
                branch="main"
                file_path=""
              elif echo "$remain" | grep -qE '^(blob|tree)/'; then
                branch=$(echo "$remain" | cut -d'/' -f2)
                file_path=$(echo "$remain" | cut -d'/' -f3-)
              elif echo "$url" | grep -q 'raw\.githubusercontent\.com'; then
                branch=$(echo "$remain" | cut -d'/' -f1)
                file_path=$(echo "$remain" | cut -d'/' -f2-)
              elif echo "$remain" | grep -q '^refs/heads/'; then
                branch=$(echo "$remain" | sed -E 's|^refs/heads/([^/]+)/.*|\1|')
                file_path=$(echo "$remain" | sed -E 's|^refs/heads/[^/]+/||')
              else
                branch="main"
                file_path="$remain"
              fi

              if [ -n "$owner" ] && [ -n "$repo" ] && [ -n "$branch" ] && [ -n "$file_path" ]; then
                local api_url="https://api.github.com/repos/$owner/$repo/commits?path=$file_path&sha=$branch&per_page=1"
                local response=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" "$api_url")
                if echo "$response" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
                  local date_commit=$(echo "$response" | jq -r '.[0].commit.committer.date // .[0].commit.author.date // empty' 2>/dev/null)
                  if [ -n "$date_commit" ] && [ "$date_commit" != "null" ]; then
                    echo "$date_commit"
                    set -e
                    return 0
                  fi
                fi
              fi
            fi
            set -e
            return 1
          }

          # ----------------------------------------------------------
          # Все остальные сайты – через HTTP-заголовок Last-Modified
          # (используем GET с Range, чтобы гарантированно получить заголовки)
          # ----------------------------------------------------------
          get_last_modified_date() {
            local url="$1"
            set +e
            # Используем GET с байтовым диапазоном 0-0, чтобы не скачивать файл, но получить заголовки
            local headers=$(curl -s -L --range 0-0 --dump-header - -o /dev/null --max-time 15 "$url" 2>/dev/null)
            local last_modified=$(echo "$headers" | grep -i '^last-modified:' | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\r')
            if [ -n "$last_modified" ]; then
              date -d "$last_modified" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || { set -e; return 1; }
              set -e
              return 0
            else
              set -e
              return 1
            fi
          }

          # ----------------------------------------------------------
          # Проверка устаревания (срок в днях)
          # ----------------------------------------------------------
          is_stale_date() {
            local date_str="$1"
            local days_limit="$2"
            [ -z "$date_str" ] || [ "$date_str" = "null" ] && return 1
            local current_epoch=$(date -u +%s)
            local commit_epoch=$(date -u -d "$date_str" +%s 2>/dev/null) || return 1
            local age_days=$(( (current_epoch - commit_epoch) / 86400 ))
            [ $age_days -gt $days_limit ]
          }

          # ----------------------------------------------------------
          # Подготовка файлов
          # ----------------------------------------------------------
          touch sources.txt old_sources.txt
          cp sources.txt sources_backup.txt
          cp old_sources.txt old_sources_backup.txt

          STALE_DAYS=3
          > sources.txt
          > old_sources.txt

          # ----------------------------------------------------------
          # Основная функция валидации одной строки
          # ----------------------------------------------------------
          validate_source() {
            local line="$1"
            local is_old_list="$2"

            [ -z "$line" ] && return

            # Комментарии сохраняем без изменений в соответствующий файл
            if echo "$line" | grep -q '^\s*#'; then
              if [ "$is_old_list" = true ]; then
                echo "$line" >> old_sources.txt
              else
                echo "$line" >> sources.txt
              fi
              return
            fi

            local line_clean="$line"
            local is_json=false
            if echo "$line" | grep -q '^j[[:space:]]'; then
              is_json=true
              line_clean=$(echo "$line" | sed -e 's/^j[[:space:]]*//')
            fi

            local url=$(echo "$line_clean" | awk '{print $1}')

            # Один запрос curl для кода и финального URL
            set +e
            local curl_out=$(curl -sS -L --max-time 15 -o /dev/null -w "%{http_code} %{url_effective}" "$url" 2>/dev/null || echo "000 $url")
            set -e
            local http_code=$(echo "$curl_out" | awk '{print $1}')
            local effective_url=$(echo "$curl_out" | awk '{print $2}')

            # Отладочный вывод (можно закомментировать, если мешает)
            echo "   -> effective_url: $effective_url" >&2
            echo "   -> http_code: $http_code" >&2

            # Проверка доступности
            if [ -z "$http_code" ] || [[ ! "$http_code" =~ ^[23] ]]; then
              echo " ❌ Недоступен (HTTP $http_code): $url" >&2
              echo "$line" >> old_sources.txt
              return
            fi

            if ! $is_json; then
              local last_update=""
              if echo "$effective_url" | grep -qE 'github\.com|raw\.githubusercontent\.com|gist\.github\.com|gist\.githubusercontent\.com'; then
                last_update=$(get_github_last_commit_date "$effective_url")
                if [ -z "$last_update" ]; then
                  echo "   ℹ️ Дата коммита не найдена" >&2
                fi
              else
                last_update=$(get_last_modified_date "$effective_url")
                if [ -z "$last_update" ]; then
                  echo "   ℹ️ Last-Modified не найден" >&2
                fi
              fi

              if [ -n "$last_update" ] && [ "$last_update" != "null" ]; then
                if is_stale_date "$last_update" $STALE_DAYS; then
                  echo " ⚠️ Устарел ($last_update): $url" >&2
                  echo "$line" >> old_sources.txt
                  return
                else
                  echo "   📅 Обновлён $last_update" >&2
                fi
              fi
            fi

            if [ "$is_old_list" = true ]; then
              echo " 🎉 Ожил!: $url" >&2
            else
              echo " ✅ Актуален: $url" >&2
            fi
            echo "$line" >> sources.txt
          }

          # ----------------------------------------------------------
          # Запуск проверки
          # ----------------------------------------------------------
          echo "====== ПРОВЕРКА sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" false || true
          done < sources_backup.txt

          echo "====== ПРОВЕРКА old_sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" true || true
          done < old_sources_backup.txt

          rm -f sources_backup.txt old_sources_backup.txt

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.txt old_sources.txt
          git diff --staged --quiet || (git commit -m "Обновление $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
