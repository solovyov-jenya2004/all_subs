name: Проверка источников

on:
  workflow_dispatch:

jobs:
  check-and-revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Проверить источники и обновить списки
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ----------------------------------------------------------
          # GitHub / Gist – через API коммитов
          # ----------------------------------------------------------
          get_github_last_commit_date() {
            local url="$1"
            
            # 1. Обработка Gist
            if echo "$url" | grep -qE 'gist\.githubusercontent\.com|gist\.github\.com'; then
              local gist_id=$(echo "$url" | sed -E 's|https://[^/]+/([^/]+)/?.*|\1|' | awk -F/ '{print $(NF)}')
              if [ -n "$gist_id" ]; then
                local response=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" "https://github.com")
                echo "$response" | jq -r '.updated_at // .history[0].committed_at // .created_at' 2>/dev/null
                return 0
              fi
              return 1
            fi

            # 2. Обработка обычного GitHub
            if echo "$url" | grep -qE 'github\.com|raw\.githubusercontent\.com'; then
              local clean_path=$(echo "$url" | sed -E 's|https://(raw\.)?github(usercontent)?\.com/||')
              
              local owner=$(echo "$clean_path" | cut -d'/' -f1)
              local repo=$(echo "$clean_path" | cut -d'/' -f2)
              local remain=$(echo "$clean_path" | cut -d'/' -f3-)
              
              local branch=""
              local file_path=""

              if echo "$remain" | grep -q '^refs/heads/'; then
                branch=$(echo "$remain" | sed -E 's|^refs/heads/([^/]+)/.*|\1|')
                file_path=$(echo "$remain" | sed -E 's|^refs/heads/[^/]+/||')
              elif echo "$url" | grep -q 'raw\.githubusercontent\.com'; then
                branch=$(echo "$remain" | cut -d'/' -f1)
                file_path=$(echo "$remain" | cut -d'/' -f2-)
              else
                branch=$(echo "$remain" | cut -d'/' -f2)
                file_path=$(echo "$remain" | cut -d'/' -f3-)
              fi

              if [ -n "$owner" ] && [ -n "$repo" ] && [ -n "$branch" ] && [ -n "$file_path" ]; then
                local api_url="https://github.com"
                local response=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" "$api_url")
                if echo "$response" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
                  echo $(echo "$response" | jq -r '.[0].commit.committer.date // .[0].commit.author.date')
                  return 0
                fi
              fi
            fi
            return 1
          fi

          # ----------------------------------------------------------
          # Все остальные сайты – через HTTP-заголовок Last-Modified
          # ----------------------------------------------------------
          get_last_modified_date() {
            local url="$1"
            local headers=$(curl -sI -L --max-time 15 "$url" 2>/dev/null)
            local last_modified=$(echo "$headers" | grep -i '^last-modified:' | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\r')
            if [ -n "$last_modified" ]; then
              date -d "$last_modified" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || return 1
            else
              return 1
            fi
          fi

          # ----------------------------------------------------------
          # Проверка устаревания (срок в днях)
          # ----------------------------------------------------------
          is_stale_date() {
            local date_str="$1"
            local days_limit="$2"
            [ -z "$date_str" ] || [ "$date_str" = "null" ] && return 1
            local current_epoch=$(date -u +%s)
            local commit_epoch=$(date -u -d "$date_str" +%s 2>/dev/null) || return 1
            local age_days=$(( (current_epoch - commit_epoch) / 86400 ))
            [ $age_days -gt $days_limit ]
          fi

          # ----------------------------------------------------------
          # Подготовка файлов
          # ----------------------------------------------------------
          touch sources.txt old_sources.txt
          cp sources.txt sources_backup.txt
          cp old_sources.txt old_sources_backup.txt

          STALE_DAYS=3
          > sources.txt
          > old_sources.txt

          # ----------------------------------------------------------
          # Основная функция валидации ссылки
          # ----------------------------------------------------------
          validate_source() {
            local line="$1"
            local is_old_list="$2"

            [ -z "$line" ] && return
            echo "$line" | grep -q '^\s*#' && { echo "$line" >> ( [ "$is_old_list" = true ] && echo "old_sources.txt" || echo "sources.txt" ); return; }

            local line_clean="$line"
            local is_json=false
            if echo "$line" | grep -q '^j[[:space:]]'; then
              is_json=true
              line_clean=$(echo "$line" | sed -e 's/^j[[:space:]]*//')
            fi

            local url=$(echo "$line_clean" | awk '{print $1}')
            
            # Стабильный curl с fallback-значением, если сайт полностью «лежит»
            local curl_out=$(curl -sS -L --max-time 15 -o /dev/null -w "%{http_code} %{url_effective}" "$url" 2>/dev/null || echo "000 $url")
            local http_code=$(echo "$curl_out" | awk '{print $1}')
            local effective_url=$(echo "$curl_out" | awk '{print $2}')

            # ИСПРАВЛЕНО: Корректное регулярное выражение проверки успешных кодов (2xx и 3xx)
            if [[ ! "$http_code" =~ ^[23] ]]; then
              echo " ❌ Недоступен (HTTP $http_code): $url" >&2
              echo "$line" >> old_sources.txt
              return
            fi

            if ! $is_json; then
              local last_update=""
              if echo "$effective_url" | grep -qE 'github\.com|raw\.githubusercontent\.com|gist\.github\.com|gist\.githubusercontent\.com'; then
                last_update=$(get_github_last_commit_date "$effective_url")
              else
                last_update=$(get_last_modified_date "$effective_url")
              fi

              if [ -n "$last_update" ] && [ "$last_update" != "null" ]; then
                if is_stale_date "$last_update" $STALE_DAYS; then
                  echo " ⚠️ Устарел ($last_update): $url" >&2
                  echo "$line" >> old_sources.txt
                  return
                fi
              fi
            fi

            if $is_old_list; then
              echo " 🎉 Ожил!: $url" >&2
            else
              echo " ✅ Актуален: $url" >&2
            fi
            echo "$line" >> sources.txt
          }

          # ----------------------------------------------------------
          # Запуск циклов проверки
          # ----------------------------------------------------------
          echo "====== ПРОВЕРКА sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" false
          done < sources_backup.txt

          echo "====== ПРОВЕРКА old_sources.txt ======"
          while IFS= read -r line || [ -n "$line" ]; do
            validate_source "$line" true
          done < old_sources_backup.txt

          rm -f sources_backup.txt old_sources_backup.txt

      - name: Закоммитить изменения
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          if ! git diff --quiet; then
            git add sources.txt old_sources.txt
            git commit -m "Автоматическая проверка и обновление списков источников"
            git push
          fi
